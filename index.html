<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="シャトルラン">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>シャトルラン</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:#0b0d10;color:#f2f4f7;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;
}
#app{
  height:100%;display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top) + 46px) 20px calc(env(safe-area-inset-bottom) + 18px);
}

.head{text-align:center}
.laps{
  font-size:104px;font-weight:250;line-height:1;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum";
}
.unit{font-size:36px;font-weight:300;color:#8b95a1;margin-left:8px;letter-spacing:0}
.meta{font-size:19px;color:#8b95a1;margin-top:20px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.dlabel{font-size:17px;color:#5c6672;margin-right:11px;letter-spacing:.04em}
.dist{font-size:31px;color:#f2f4f7;font-weight:300;margin-top:12px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.big{
  position:relative;margin:auto 0;
  width:min(33vw,131px);aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;
  background:#ff6b35;color:#0b0d10;display:flex;align-items:center;justify-content:center;
  transition:background .15s;flex:0 0 auto;
  touch-action:manipulation;-webkit-touch-callout:none;
}
.big:active{transform:scale(.97)}
.big.playing{background:#1b2029;color:#ff6b35}
.big.holding{background:#212832}
.big #ico{width:34%;height:34%}

/* 長押しの進捗リング */
.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);pointer-events:none;opacity:0}
.big.holding .ring{opacity:1}
.ring circle{fill:none;stroke:#ff6b35;stroke-width:4}

#toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom) + 30px);
  background:#232932;color:#f2f4f7;font-size:13px;padding:12px 22px;border-radius:999px;
  opacity:0;transition:opacity .25s;pointer-events:none;max-width:86vw;text-align:center;
}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div class="head">
    <div class="laps"><span id="laps">0</span><span class="unit">本</span></div>
    <div class="meta" id="meta">レベル1 · 8.0km/h</div>
    <div class="dist"><span class="dlabel">走行距離</span><span id="dist">0m</span></div>
  </div>

  <button class="big" id="play" aria-label="開始">
    <svg class="ring" viewBox="0 0 100 100"><circle id="prog" cx="50" cy="50" r="48"/></svg>
    <svg id="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.54.84l10-6.5a1 1 0 0 0 0-1.68l-10-6.5A1 1 0 0 0 8 5.5z"/></svg>
  </button>
</div>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);

/* ==================== ペース設計 ====================
   20mシャトルランそのものを走る。違いは折り返しが80mごとになることだけ。
   ・カウントは20mごと。間隔もレベルの切り替わりも20m版の規定どおり
   ・4カウント＝80m＝1本。先頭のカウントが「完走した本数」になる
     0,2,3,4 → 1,2,3,4 → 2,2,3,4 …
   ・したがって速度の推移は20mシャトルランと完全に一致する
==================================================== */
const REPS = [7,8,8,9,9,10,10,11,11,11,12,12,13,13,13,14,14,15,15,16,16]; // 各レベルの折り返し回数
const SEG  = 20;   // カウント1つぶんの距離(m)

const speedOf = lv => lv === 1 ? 8.0 : 9.0 + 0.5 * (lv - 2);   // km/h
const gapSec  = lv => SEG * 3.6 / speedOf(lv);                 // カウントの間隔(秒)

const ONES = ['ゼロ','いち','に','さん','よん','ご','ろく','なな','はち','きゅう'];
function ja(n){
  if(n < 10)  return ONES[n];
  if(n < 20)  return 'じゅう' + (n % 10 ? ONES[n % 10] : '');
  return ONES[Math.floor(n / 10)] + 'じゅう' + (n % 10 ? ONES[n % 10] : '');
}

function buildEvents(){
  const ev = [];
  let t = 0, n = 0;                                   // n = 累計カウント数（20m版の折り返し回数と同じ）
  ev.push({t: 0, say: 'ゼロ', lap: 0, level: 1, dist: 0});
  for(let lv = 1; lv <= REPS.length; lv++){
    const gap = gapSec(lv);
    for(let i = 0; i < REPS[lv - 1]; i++){
      t += gap; n++;
      const lap = Math.floor(n / 4);                  // 完走した本数
      ev.push({
        t, level: lv, lap, dist: n * SEG,
        say: n % 4 === 0 ? ja(lap) : ONES[(n % 4) + 1]
      });
    }
  }
  while(ev.length > 1 && (ev.length - 1) % 4 !== 0) ev.pop();   // 本数の区切りで終わらせる
  return ev;
}
const EVENTS = buildEvents();

/* ==================== 読み上げ ==================== */
let voice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => v.lang === 'ja-JP') || vs.find(v => v.lang && v.lang.startsWith('ja')) || null;
}
pickVoice();
if('onvoiceschanged' in speechSynthesis) speechSynthesis.onvoiceschanged = pickVoice;

function speak(text){
  try{
    speechSynthesis.cancel();                       // 前の発話が残っていたら打ち切る
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; u.rate = 1.1; u.volume = 1;
    if(voice) u.voice = voice;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ==================== 表示 ==================== */
let toastTimer;
function toast(msg, ms){
  const t = $('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), ms || 2600);
}

/* ==================== 進行 ==================== */
const PLAY = 'M8 5.5v13a1 1 0 0 0 1.54.84l10-6.5a1 1 0 0 0 0-1.68l-10-6.5A1 1 0 0 0 8 5.5z';
const STOP = 'M6.5 8a1.5 1.5 0 0 1 1.5-1.5h8a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5h-8a1.5 1.5 0 0 1-1.5-1.5z';

let running = false, t0 = 0, idx = 0, loop = null, lastLap = 0, curLevel = 1;

function paint(){
  $('ico').firstElementChild.setAttribute('d', running ? STOP : PLAY);
  $('play').classList.toggle('playing', running);
  $('play').setAttribute('aria-label', running ? '長押しで停止' : '開始');
}

function show(lap, level, dist){
  $('laps').textContent = lap;
  $('meta').textContent = 'レベル' + level + ' · ' + speedOf(level).toFixed(1) + 'km/h';
  $('dist').textContent = dist + 'm';
}

function step(){
  const now = (performance.now() - t0) / 1000;
  while(idx < EVENTS.length && EVENTS[idx].t <= now){
    const e = EVENTS[idx++];
    speak(e.say);
    lastLap = e.lap; curLevel = e.level;
    show(e.lap, e.level, e.dist);
  }
  if(idx >= EVENTS.length) finish();
}

function begin(){
  t0 = performance.now();
  idx = 0; lastLap = 0; curLevel = 1;
  running = true;
  show(0, 1, 0);
  paint(); wake();
  step();                                   // 最初の「ゼロ」はタップ直後に発話する
  loop = setInterval(step, 40);
}
function halt(){
  if(loop){ clearInterval(loop); loop = null; }
  running = false;
  speechSynthesis.cancel();
  paint(); release();
}
function stop(){    // 長押しによる中止。本数・距離は画面に残したままにする
  halt();
}
function finish(){ // 全本数を走りきった
  halt();
}

/* ==================== 停止は2秒長押し ==================== */
const HOLD = 2000;
const btn = $('play'), prog = $('prog');
const C = 2 * Math.PI * 48;
prog.style.strokeDasharray = C;
prog.style.strokeDashoffset = C;

let raf = null, timer = null, hold0 = 0, skipClick = false;

function holdStart(){
  if(!running || timer) return;
  hold0 = performance.now();
  btn.classList.add('holding');
  timer = setTimeout(() => { timer = null; skipClick = true; stop(); }, HOLD);
  const draw = () => {
    const p = Math.min(1, (performance.now() - hold0) / HOLD);
    prog.style.strokeDashoffset = C * (1 - p);
    raf = p < 1 ? requestAnimationFrame(draw) : null;
  };
  raf = requestAnimationFrame(draw);
}
function holdEnd(){
  const held = timer ? performance.now() - hold0 : 0;
  if(timer){ clearTimeout(timer); timer = null; }
  if(raf){ cancelAnimationFrame(raf); raf = null; }
  btn.classList.remove('holding');
  prog.style.strokeDashoffset = C;
  if(held > 0 && held < 600 && running) toast('長押しで停止', 1400);
}

btn.addEventListener('pointerdown', holdStart);
btn.addEventListener('pointerup', holdEnd);
btn.addEventListener('pointercancel', holdEnd);
btn.addEventListener('pointerleave', holdEnd);
btn.addEventListener('contextmenu', e => e.preventDefault());
btn.addEventListener('click', () => {
  if(skipClick){ skipClick = false; return; }
  if(!running) begin();
});

/* ==================== 画面を消さない ==================== */
let lock = null;
async function wake(){
  try{ if('wakeLock' in navigator && !lock) lock = await navigator.wakeLock.request('screen'); }catch(e){}
}
function release(){ try{ if(lock){ lock.release(); lock = null; } }catch(e){} }
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && running) wake();
});

/* ==================== オフライン ==================== */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
