<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="シャトルラン">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>シャトルラン</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:#0b0d10;color:#f2f4f7;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;
}
#app{
  height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 14px) 20px calc(env(safe-area-inset-bottom) + 18px);
}
.hd{display:flex;align-items:center;justify-content:flex-end;flex:0 0 auto;height:26px}
.hd .gear{
  font-size:12px;color:#5c6672;background:none;border:0;padding:6px 2px 6px 10px;
  font-family:inherit;cursor:pointer;
}
section{flex:1 1 auto;display:none;flex-direction:column}
section.on{display:flex}

/* ---------- setup ---------- */
#setup{align-items:center;justify-content:center;text-align:center;gap:0}
#setup .mark{font-size:46px;line-height:1;margin-bottom:26px}
#setup h1{font-size:21px;font-weight:700;margin-bottom:14px;letter-spacing:.02em}
#setup p{font-size:14px;line-height:1.85;color:#8b95a1;margin-bottom:34px;max-width:19em}
.btn{
  font-family:inherit;font-size:16px;font-weight:700;color:#0b0d10;background:#ff6b35;
  border:0;border-radius:999px;padding:17px 40px;cursor:pointer;letter-spacing:.02em;
}
.btn:active{transform:scale(.97)}
.btn.ghost{background:none;color:#8b95a1;border:1.5px solid #2a3038;padding:14px 30px;font-size:14px}
#setup .note{font-size:12px;color:#5c6672;margin-top:26px;line-height:1.7}

/* ---------- player ---------- */
#player{align-items:center;justify-content:space-between;padding-top:8px}
.clock{text-align:center;padding-top:34px}
.elapsed{
  font-size:64px;font-weight:250;line-height:1;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum";
}

.big{
  width:min(62vw,250px);aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;
  background:#ff6b35;color:#0b0d10;display:flex;align-items:center;justify-content:center;
  transition:background .15s;flex:0 0 auto;
}
.big:active{transform:scale(.97)}
.big.playing{background:#1b2029;color:#ff6b35;border:2px solid #2a3038}
.big svg{width:34%;height:34%}

.foot{width:100%;display:flex;flex-direction:column;align-items:center;gap:16px}
.seek{
  width:100%;-webkit-appearance:none;appearance:none;background:none;height:26px;cursor:pointer;
}
.seek::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:#232932}
.seek::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#f2f4f7;
  margin-top:-8.5px;box-shadow:0 1px 5px rgba(0,0,0,.5);
}
.sub{display:flex}
.sub button{
  font-family:inherit;font-size:13px;color:#8b95a1;background:#151a21;border:0;
  border-radius:999px;padding:11px 20px;cursor:pointer;
}
.sub button:active{background:#1b2029}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom) + 30px);
  background:#232932;color:#f2f4f7;font-size:13px;padding:12px 22px;border-radius:999px;
  opacity:0;transition:opacity .25s;pointer-events:none;max-width:86vw;text-align:center;
}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div class="hd">
    <button class="gear" id="change" hidden>音源を変更</button>
  </div>

  <section id="setup">
    <div class="mark">🎧</div>
    <h1>音源を読み込む</h1>
    <p>初回だけの設定です。iPhoneに保存したシャトルランの音源ファイルを選んでください。</p>
    <button class="btn" id="pick">音源ファイルを選ぶ</button>
    <div class="note">選んだ音源はこのiPhoneの中に保存されます。<br>次回からはこの画面は出ません。</div>
  </section>

  <section id="player">
    <div class="clock">
      <div class="elapsed" id="elapsed">0:00</div>
    </div>

    <button class="big" id="play" aria-label="再生">
      <svg id="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.54.84l10-6.5a1 1 0 0 0 0-1.68l-10-6.5A1 1 0 0 0 8 5.5z"/></svg>
    </button>

    <div class="foot">
      <input class="seek" id="seek" type="range" min="0" max="1000" value="0" step="1">
      <div class="sub">
        <button id="reset">最初から</button>
      </div>
    </div>
  </section>
</div>

<input type="file" id="file" accept="audio/*,.mp3,.m4a,.wav" hidden>
<audio id="audio" preload="auto"></audio>
<div id="toast"></div>

<script>
const $ = s => document.getElementById(s);
const audio = $('audio');
const DB='shuttlerun', STORE='files', KEY='audio';

/* ---------- IndexedDB ---------- */
function db(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open(DB,1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result);
    r.onerror   = () => rej(r.error);
  });
}
async function put(blob){
  const d = await db();
  return new Promise((res,rej)=>{
    const tx = d.transaction(STORE,'readwrite');
    tx.objectStore(STORE).put(blob,KEY);
    tx.oncomplete = res;
    tx.onerror    = () => rej(tx.error);
  });
}
async function get(){
  const d = await db();
  return new Promise((res,rej)=>{
    const tx = d.transaction(STORE,'readonly');
    const q  = tx.objectStore(STORE).get(KEY);
    q.onsuccess = () => res(q.result || null);
    q.onerror   = () => rej(q.error);
  });
}

/* ---------- helpers ---------- */
function fmt(s){
  if(!isFinite(s) || s < 0) s = 0;
  s = Math.floor(s);
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}
let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('on'), 2600);
}
function show(which){
  $('setup').classList.toggle('on', which === 'setup');
  $('player').classList.toggle('on', which === 'player');
  $('change').hidden = which !== 'player';
}

/* ---------- load ---------- */
let objectUrl = null;
function attach(blob){
  if(objectUrl) URL.revokeObjectURL(objectUrl);
  objectUrl = URL.createObjectURL(blob);
  audio.src = objectUrl;
  audio.load();
}
(async function init(){
  try{
    const blob = await get();
    if(blob){ attach(blob); show('player'); }
    else show('setup');
  }catch(e){ show('setup'); }
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
})();

/* ---------- file pick ---------- */
$('pick').onclick   = () => $('file').click();
$('change').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0];
  if(!f) return;
  toast('保存しています…');
  try{
    await put(f);
    attach(f);
    show('player');
    toast('準備できました');
  }catch(err){
    toast('保存できませんでした：' + (err && err.name || 'エラー'));
  }
  e.target.value = '';
};

/* ---------- playback ---------- */
const PLAY  = 'M8 5.5v13a1 1 0 0 0 1.54.84l10-6.5a1 1 0 0 0 0-1.68l-10-6.5A1 1 0 0 0 8 5.5z';
const PAUSE = 'M7 4h3.2v16H7zm6.8 0H17v16h-3.2z';
function paint(){
  const playing = !audio.paused;
  $('ico').firstElementChild.setAttribute('d', playing ? PAUSE : PLAY);
  $('play').classList.toggle('playing', playing);
  $('play').setAttribute('aria-label', playing ? '一時停止' : '再生');
}
$('play').onclick = async () => {
  try{
    if(audio.paused){ await audio.play(); wake(); }
    else audio.pause();
  }catch(err){ toast('再生できませんでした'); }
};
$('reset').onclick  = () => { audio.currentTime = 0; };

audio.addEventListener('play',  paint);
audio.addEventListener('pause', ()=>{ paint(); release(); });
audio.addEventListener('ended', ()=>{ paint(); release(); });

let seeking = false;
$('seek').addEventListener('input', ()=>{ seeking = true; });
$('seek').addEventListener('change', ()=>{
  if(isFinite(audio.duration)) audio.currentTime = audio.duration * ($('seek').value/1000);
  seeking = false;
});
function tick(){
  const d = audio.duration;
  $('elapsed').textContent = fmt(audio.currentTime);
  if(!seeking && isFinite(d) && d > 0) $('seek').value = Math.round(audio.currentTime / d * 1000);
}
audio.addEventListener('timeupdate', tick);
audio.addEventListener('loadedmetadata', tick);

/* ---------- lock screen controls ---------- */
if('mediaSession' in navigator){
  navigator.mediaSession.metadata = new MediaMetadata({ title:'20mシャトルラン', artist:'' });
  navigator.mediaSession.setActionHandler('play',  ()=>audio.play());
  navigator.mediaSession.setActionHandler('pause', ()=>audio.pause());
}

/* ---------- keep screen awake ---------- */
let lock = null;
async function wake(){
  try{ if('wakeLock' in navigator && !lock) lock = await navigator.wakeLock.request('screen'); }catch(e){}
}
function release(){ try{ if(lock){ lock.release(); lock = null; } }catch(e){} }
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && !audio.paused) wake();
});

/* ---------- offline ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
